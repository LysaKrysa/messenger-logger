<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Sign in · Messenger workspace</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head>
<body class="login-body">
  <main class="login-panel">
    <div class="brand login-brand"><span class="brand-icon" aria-hidden="true">m</span><span>Messenger<span class="brand-sub">Private workspace</span></span></div>
    <h1>Sign in to your workspace</h1><p class="muted">Manage connections, invitations, and delivery.</p>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">Administrator password</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required autofocus><button class="button primary full">Sign in</button></form>
    <p class="login-note">For the server administrator only.</p><a class="button secondary full" href="{{ url_for('portal.login') }}">Open your user dashboard</a>
  </main>
</body></html>
