{% macro icon(name, class='') -%}
<svg class="icon {{ class }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'send' %}<path d="m21 3-7 18-4-7-7-4 18-7Z"/><path d="m10 14 5-5"/>
{% elif name == 'link' %}<path d="m10 13 4-4m-6 6-1 1a4.2 4.2 0 0 1-6-6l4-4a4.2 4.2 0 0 1 6 0m2 3 1-1a4.2 4.2 0 0 1 6 6l-4 4a4.2 4.2 0 0 1-6 0" transform="translate(1 1)"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'back' %}<path d="m10 5-7 7 7 7M3 12h18"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
{% elif name == 'logout' %}<path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m6-13 5 5-5 5M9 12h11"/>
{% endif %}</svg>
{%- endmacro %}
