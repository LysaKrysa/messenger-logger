name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic and offline tests
        run: python -m unittest discover -s tests -v
      - name: Install optional dashboard dependencies
        run: python -m pip install -r requirements-dashboard.txt
      - name: Check administrator dashboard and account isolation
        run: python -m unittest discover -s dashboard/tests -v
      - name: Check low-latency viewer input ordering and session boundaries
        run: node --test dashboard/tests/remote.test.js
      - name: Check Bash syntax
        run: |
          bash -n show-messages
          bash -n show-deleted
          bash -n manage-topics
          bash -n cleanup-local-data
          bash -n check-telegram-topics
          bash -n server/install-service.sh
          bash -n server/install-dashboard.sh
          bash -n server/dashboard-admin

  dashboard-browser:
    name: Dashboard browser flow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install dashboard test dependencies
        run: python -m pip install -r requirements-dashboard.txt playwright==1.64.1
      - name: Verify administrator flow and mobile layout
        run: python -m dashboard.tests.browser_smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dashboard-screenshots
          path: dashboard-screenshots/
          retention-days: 3

  onboarding-browser:
    name: Sandboxed onboarding browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the separate browser image
        run: docker build --tag messenger-onboarding:browser browser/
      - name: Verify sandbox, private input, frames and container isolation offline
        run: sudo python3 browser/check_container.py

  native-container:
    name: Native build and container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build pinned transport and runtime image
        run: docker build --tag messenger-logger:ci .
      - name: Check binary and local RPC without credentials
        run: docker run --rm --network none messenger-logger:ci --self-test
      - name: Verify real managed containers with synthetic offline workers
        run: |
          python3 -m venv "$RUNNER_TEMP/dashboard-test-venv"
          "$RUNNER_TEMP/dashboard-test-venv/bin/python" -m pip install -r requirements-dashboard.txt
          sudo "$RUNNER_TEMP/dashboard-test-venv/bin/python" -m dashboard.tests.container_smoke --image messenger-logger:ci
      - name: Run the suite with the native binary
        run: |
          docker run --rm --network none \
            --env BRIDGE_TEST_BIN=/usr/local/bin/messenger-bridge \
            --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
            --entrypoint python messenger-logger:ci \
            -m unittest discover -s tests -v
